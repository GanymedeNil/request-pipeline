name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Check the zip
        run: unzip -t dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

  e2e:
    name: Browser tests on the packaged extension
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: dist
      - name: Unpack the zip that would be uploaded to the store
        # unzip -d only creates the last directory level.
        run: |
          mkdir -p build/extension
          unzip -q dist/*.zip -d build/extension
      - run: npm run test:e2e
        env:
          EXTENSION_DIR: build/extension
          SCREENSHOT_DIR: build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-screenshots
          path: build/screenshots
          if-no-files-found: ignore
