name: Release

# Push a tag like v1.2.0 to publish a GitHub release with the store zip attached.
# Before tagging: set the version in manifest.json and date the CHANGELOG.md section.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag, manifest.json and CHANGELOG.md agree
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md
      - run: npm run check
      - run: npm run package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
          --verify-tag
